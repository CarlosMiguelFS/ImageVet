# Regras de qualidade do código (rodar: flutter analyze).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

formatter:
  page_width: 120

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_final_in_for_each
    - directives_ordering
    - unawaited_futures
    - avoid_dynamic_calls
    - cancel_subscriptions
    - always_declare_return_types
    - unnecessary_lambdas
    - use_super_parameters
